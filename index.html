<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09020f" />
  <meta name="description" content="A little heartbeat made for CC." />
  <title>I Love CC</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b0412'/%3E%3Cpath d='M32 51S10 39 10 23c0-12 15-16 22-6 7-10 22-6 22 6 0 16-22 28-22 28Z' fill='%23ff3f74'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      --rose: #ff3f74;
      --rose-hot: #ff174f;
      --rose-soft: #ff91ad;
      --violet: #a855f7;
      --ink: #09020f;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", sans-serif;
      color: white;
      background:
        radial-gradient(circle at 50% 42%, rgba(103, 18, 76, .42) 0, rgba(27, 5, 34, .26) 28%, transparent 58%),
        radial-gradient(circle at 15% 0%, rgba(85, 30, 130, .22), transparent 35%),
        linear-gradient(160deg, #050109 0%, #100316 52%, #060109 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -35%;
      pointer-events: none;
      background: conic-gradient(from 45deg, transparent, rgba(255, 36, 104, .045), transparent 22%, rgba(168, 85, 247, .04), transparent 48%);
      animation: skyTurn 26s linear infinite;
    }

    #stars, #sparks {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .scene {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      isolation: isolate;
      perspective: 900px;
    }

    .love {
      position: relative;
      display: grid;
      place-items: center;
      width: min(92vw, 720px);
      padding: 3rem 1rem;
      transform-style: preserve-3d;
      transition: transform .3s ease-out;
    }

    .halo {
      position: absolute;
      top: 38%;
      left: 50%;
      width: clamp(240px, 44vw, 420px);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 48, 111, .26), rgba(176, 42, 197, .1) 38%, transparent 70%);
      filter: blur(12px);
      animation: haloBeat 1.35s ease-in-out infinite;
    }

    .rings {
      position: absolute;
      top: 38%;
      left: 50%;
      width: clamp(200px, 36vw, 340px);
      aspect-ratio: 1;
      border: 1px solid rgba(255, 116, 156, .25);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.55);
      opacity: 0;
      animation: ripple 2.7s ease-out infinite;
    }

    .rings::after {
      content: "";
      position: absolute;
      inset: -20%;
      border: 1px solid rgba(197, 91, 255, .18);
      border-radius: inherit;
    }

    .story-stage {
      position: relative;
      width: clamp(220px, 37vw, 350px);
      aspect-ratio: 512 / 470;
      display: grid;
      place-items: center;
    }

    .heart-wrap {
      position: absolute;
      inset: 0;
      width: clamp(220px, 37vw, 350px);
      filter: drop-shadow(0 0 12px rgba(255, 38, 103, .7)) drop-shadow(0 0 42px rgba(255, 20, 90, .38));
      animation: heartbeat 1.35s cubic-bezier(.17,.67,.27,1.45) infinite;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: opacity .55s ease, transform .75s cubic-bezier(.2,.8,.2,1), filter .55s ease;
    }

    .heart-wrap:focus-visible {
      filter: drop-shadow(0 0 8px white) drop-shadow(0 0 35px var(--rose));
    }

    .heart {
      display: block;
      width: 100%;
      overflow: visible;
    }

    .heart-body {
      fill: url(#heartGradient);
      stroke: rgba(255, 213, 225, .72);
      stroke-width: 1.1;
    }

    .heart-shine {
      fill: none;
      stroke: rgba(255, 255, 255, .82);
      stroke-width: 4;
      stroke-linecap: round;
      filter: blur(.2px);
      opacity: .7;
    }

    .heart-glass {
      fill: url(#glassGradient);
      opacity: .7;
    }

    .proposal,
    .answer {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      place-items: center;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(.64) translateY(18px);
      transition: opacity .6s ease, transform .8s cubic-bezier(.18,.89,.32,1.28);
    }

    .proposal h2 {
      max-width: 9ch;
      margin: 0;
      font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
      font-size: clamp(2.8rem, 7.5vw, 5.2rem);
      font-weight: 500;
      line-height: .98;
      color: #fff5f8;
      text-wrap: balance;
      text-shadow: 0 0 12px rgba(255,255,255,.45), 0 0 28px rgba(255,45,108,.8), 0 0 60px rgba(170,52,222,.48);
    }

    .yes-button {
      min-width: 140px;
      margin-top: 2rem;
      padding: .9rem 2.3rem;
      border: 1px solid rgba(255, 225, 234, .78);
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, #ff6592, #ec1859 55%, #a924ad);
      box-shadow: 0 9px 34px rgba(236, 24, 89, .42), inset 0 1px 0 rgba(255,255,255,.45);
      font: 800 1rem/1 ui-rounded, "SF Pro Rounded", "Segoe UI", sans-serif;
      letter-spacing: .22em;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .yes-button:hover {
      transform: translateY(-3px) scale(1.045);
      box-shadow: 0 14px 42px rgba(236, 24, 89, .58), inset 0 1px 0 rgba(255,255,255,.58);
      filter: saturate(1.14);
    }

    .yes-button:active { transform: translateY(0) scale(.98); }
    .yes-button:focus-visible { outline: 3px solid rgba(255,255,255,.92); outline-offset: 5px; }

    .smile {
      display: block;
      font-size: clamp(8rem, 24vw, 13.5rem);
      line-height: 1;
      filter: drop-shadow(0 0 14px rgba(255,203,72,.68)) drop-shadow(0 0 48px rgba(255,73,130,.48));
      animation: happyFloat 2.2s ease-in-out infinite;
    }

    .love.is-question .heart-wrap,
    .love.is-yes .heart-wrap {
      animation: none;
      opacity: 0;
      transform: scale(.26) rotate(22deg);
      filter: blur(14px) drop-shadow(0 0 30px rgba(255, 38, 103, .5));
      pointer-events: none;
    }

    .love.is-question .proposal,
    .love.is-yes .answer {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    .love.is-yes .proposal {
      opacity: 0;
      transform: scale(1.34) translateY(-10px);
      pointer-events: none;
    }

    .hint { transition: opacity .35s ease; }
    .love.is-question .hint,
    .love.is-yes .hint { opacity: 0; }

    .love-note {
      position: relative;
      margin-top: clamp(1.5rem, 5vh, 3.2rem);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
      font-size: clamp(3rem, 9vw, 6.5rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -.035em;
      background: linear-gradient(90deg, #fff3f7 0%, #ff9bb8 35%, #ffffff 54%, #dc90ff 100%);
      background-size: 220% 100%;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 4px 24px rgba(255, 76, 132, .45));
      animation: shimmer 5s ease-in-out infinite;
    }

    .line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      width: min(330px, 65vw);
      margin: .9rem auto 0;
      color: rgba(255, 221, 231, .6);
    }

    .line::before, .line::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, currentColor);
    }
    .line::after { transform: scaleX(-1); }

    .tiny-heart {
      font-size: .78rem;
      color: var(--rose-soft);
      text-shadow: 0 0 12px var(--rose);
      animation: tinyBeat 1.35s ease-in-out infinite;
    }

    .hint {
      margin: .9rem 0 0;
      color: rgba(255, 234, 240, .55);
      font-size: .9rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .petal {
      position: fixed;
      z-index: 1;
      top: -10vh;
      width: 8px;
      height: 12px;
      border-radius: 90% 0 90% 20%;
      background: linear-gradient(135deg, #ff8caf, #c35cff);
      box-shadow: 0 0 10px rgba(255, 90, 145, .42);
      opacity: .55;
      pointer-events: none;
      animation: petalFall linear infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: translateY(0) scale(1) rotate(-1deg); }
      10% { transform: translateY(-8px) scale(1.09) rotate(0deg); }
      20% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-4px) scale(1.045); }
      43% { transform: translateY(0) scale(1); }
    }
    @keyframes haloBeat {
      0%, 100% { transform: translate(-50%, -50%) scale(.88); opacity: .55; }
      12% { transform: translate(-50%, -50%) scale(1.08); opacity: .95; }
      30% { transform: translate(-50%, -50%) scale(.98); opacity: .68; }
    }
    @keyframes ripple {
      0%, 18% { transform: translate(-50%, -50%) scale(.48); opacity: 0; }
      28% { opacity: .65; }
      75%, 100% { transform: translate(-50%, -50%) scale(1.75); opacity: 0; }
    }
    @keyframes shimmer { 0%, 100% { background-position: 100% 50%; } 50% { background-position: 0% 50%; } }
    @keyframes tinyBeat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.45); } 30% { transform: scale(1); } }
    @keyframes happyFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
      50% { transform: translateY(-12px) rotate(2deg) scale(1.04); }
    }
    @keyframes skyTurn { to { transform: rotate(360deg); } }
    @keyframes petalFall {
      to { transform: translate3d(var(--drift), 120vh, 0) rotate(680deg); }
    }

    @media (max-height: 650px) {
      .love { transform: scale(.82); padding: .5rem; }
      .love-note { margin-top: .6rem; }
      .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="sparks" aria-hidden="true"></canvas>

  <main class="scene">
    <section class="love" aria-label="A glowing heart for CC">
      <div class="halo" aria-hidden="true"></div>
      <div class="rings" aria-hidden="true"></div>

      <div class="story-stage">
        <div class="heart-wrap" role="button" tabindex="0" aria-label="Reveal a question">
          <svg class="heart" viewBox="0 0 512 470" role="img" aria-label="Glowing pink heart">
            <defs>
              <linearGradient id="heartGradient" x1="15%" y1="10%" x2="86%" y2="92%">
                <stop offset="0" stop-color="#ff99b9"/>
                <stop offset=".28" stop-color="#ff376f"/>
                <stop offset=".65" stop-color="#ec124d"/>
                <stop offset="1" stop-color="#8f093d"/>
              </linearGradient>
              <linearGradient id="glassGradient" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#ffffff" stop-opacity=".55"/>
                <stop offset=".42" stop-color="#ffffff" stop-opacity=".03"/>
                <stop offset="1" stop-color="#6a002b" stop-opacity=".38"/>
              </linearGradient>
            </defs>
            <path class="heart-body" d="M256 449C226 421 65 313 34 203 8 112 62 35 148 24c49-6 88 17 108 55 20-38 59-61 108-55 86 11 140 88 114 179-31 110-192 218-222 246Z"/>
            <path class="heart-glass" d="M256 429C217 394 82 298 52 199 29 124 72 57 151 44c46-8 81 14 105 62 26-47 64-67 108-61 48 7 84 36 101 76-69-25-124-2-157 56-41 72-81 154-52 252Z"/>
            <path class="heart-shine" d="M94 137c17-42 53-62 88-60 20 1 34 9 43 20"/>
          </svg>
        </div>

        <div class="proposal" aria-live="polite" aria-hidden="true">
          <h2>Will u marry me?</h2>
          <button class="yes-button" type="button" tabindex="-1">YES</button>
        </div>

        <div class="answer" aria-live="polite" aria-hidden="true">
          <span class="smile" role="img" aria-label="Happy smiling face">😊</span>
        </div>
      </div>

      <div class="love-note">
        <h1>I love CC</h1>
        <div class="line" aria-hidden="true"><span class="tiny-heart">♥</span></div>
        <p class="hint">tap the heart</p>
      </div>
    </section>
  </main>

  <script>
    const starCanvas = document.querySelector('#stars');
    const sparkCanvas = document.querySelector('#sparks');
    const starCtx = starCanvas.getContext('2d');
    const sparkCtx = sparkCanvas.getContext('2d');
    const heart = document.querySelector('.heart-wrap');
    const love = document.querySelector('.love');
    const storyStage = document.querySelector('.story-stage');
    const proposal = document.querySelector('.proposal');
    const answer = document.querySelector('.answer');
    const yesButton = document.querySelector('.yes-button');
    let storyState = 'heart';
    let stars = [], sparks = [], width = 0, height = 0, dpr = 1;

    function resize() {
      width = innerWidth; height = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
      for (const canvas of [starCanvas, sparkCanvas]) {
        canvas.width = width * dpr; canvas.height = height * dpr;
        canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
      }
      starCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      sparkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.min(150, Math.floor(width * height / 9000)) }, () => ({
        x: Math.random() * width, y: Math.random() * height,
        r: Math.random() * 1.25 + .25, a: Math.random() * .65 + .15,
        phase: Math.random() * Math.PI * 2, speed: Math.random() * .018 + .006
      }));
    }

    function drawStars(time) {
      starCtx.clearRect(0, 0, width, height);
      stars.forEach(s => {
        const alpha = s.a * (.55 + Math.sin(time * s.speed + s.phase) * .4);
        starCtx.beginPath(); starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        starCtx.fillStyle = `rgba(255,220,240,${alpha})`; starCtx.fill();
      });
    }

    function burst(amount = 34) {
      const box = storyStage.getBoundingClientRect();
      const x = box.left + box.width / 2, y = box.top + box.height / 2;
      for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3.2 + 1.3;
        sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - .8,
          life: 1, decay: Math.random() * .014 + .012, size: Math.random() * 3.3 + 1.3,
          hue: Math.random() > .22 ? 340 : 285 });
      }
    }

    function drawSparks() {
      sparkCtx.clearRect(0, 0, width, height);
      sparks = sparks.filter(p => p.life > 0);
      sparks.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vx *= .985; p.vy = p.vy * .985 + .012; p.life -= p.decay;
        sparkCtx.save(); sparkCtx.translate(p.x, p.y); sparkCtx.rotate(Math.PI / 4);
        sparkCtx.fillStyle = `hsla(${p.hue},100%,72%,${p.life})`;
        sparkCtx.shadowBlur = 12; sparkCtx.shadowColor = `hsl(${p.hue},100%,62%)`;
        sparkCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        sparkCtx.restore();
      });
    }

    function animate(time = 0) {
      drawStars(time); drawSparks(); requestAnimationFrame(animate);
    }

    function addPetals() {
      for (let i = 0; i < 10; i++) {
        const p = document.createElement('i'); p.className = 'petal';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.setProperty('--drift', (Math.random() * 180 - 90) + 'px');
        p.style.animationDuration = (Math.random() * 8 + 9) + 's';
        p.style.animationDelay = (-Math.random() * 16) + 's';
        p.style.transform = `scale(${Math.random() * .8 + .45})`;
        document.body.appendChild(p);
      }
    }

    function revealQuestion() {
      if (storyState !== 'heart') return;
      storyState = 'question';
      burst(58);
      love.classList.add('is-question');
      heart.setAttribute('aria-hidden', 'true');
      heart.setAttribute('tabindex', '-1');
      proposal.setAttribute('aria-hidden', 'false');
      yesButton.setAttribute('tabindex', '0');
      setTimeout(() => yesButton.focus(), 620);
    }

    function sayYes() {
      if (storyState !== 'question') return;
      storyState = 'yes';
      burst(110);
      love.classList.remove('is-question');
      love.classList.add('is-yes');
      yesButton.disabled = true;
      yesButton.setAttribute('tabindex', '-1');
      proposal.setAttribute('aria-hidden', 'true');
      answer.setAttribute('aria-hidden', 'false');
    }

    heart.addEventListener('click', revealQuestion);
    heart.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); revealQuestion(); } });
    yesButton.addEventListener('click', sayYes);
    document.addEventListener('pointermove', e => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const rx = (e.clientY / height - .5) * -5, ry = (e.clientX / width - .5) * 6;
      love.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    });

    addEventListener('resize', resize);
    resize(); addPetals(); animate();
    setTimeout(() => burst(40), 700);
  </script>
</body>
</html>
